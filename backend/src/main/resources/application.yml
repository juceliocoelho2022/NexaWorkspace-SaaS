spring:
  application:
    name: nexaworkspace-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nexaworkspace}
    username: ${DB_USER:nexa}
    password: ${DB_PASSWORD:nexa123}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-this-secret-to-at-least-32-bytes-1234567890}
    ttl-minutes: ${JWT_TTL_MINUTES:120}
