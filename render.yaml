services:
  - type: web
    name: nexaworkspace-saas
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexaworkspace-db
          property: connectionString
      - key: DB_USER
        fromDatabase:
          name: nexaworkspace-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: nexaworkspace-db
          property: password
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: nexaworkspace-cache
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: EVENTS_ENABLED
        value: "false"
      - key: BILLING_MODE
        value: sandbox
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRO_PRICE_ID
        sync: false
      - key: STRIPE_BUSINESS_PRICE_ID
        sync: false
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false

  - type: keyvalue
    name: nexaworkspace-cache
    plan: free
    region: virginia
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: nexaworkspace-db
    plan: free
    region: virginia
    postgresMajorVersion: "18"
    databaseName: nexaworkspace
    user: nexa
